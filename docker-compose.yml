# Ports
# ======================
# 3306 -- hivemetastore db
# 5432 -- postgresql
# 3307 -- mysqldb
# 8080 -- airflow
# 8086 -- trino
# 8081 -- kafka-ui
# 9000 -- minio
# 9001 -- minio
# 9090 -- prometheus
# 3000 -- grafana
# 9092 -- kafka
# 8888 -- jupyter

version: '3.7'
services:
  minio:
    image: minio/minio:RELEASE.2023-07-21T21-12-44Z
    container_name: minio
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=password
      - MINIO_DOMAIN=storage
      - MINIO_REGION_NAME=us-east-1
      - MINIO_REGION=us-east-1
    volumes:
      - ../volumes/minio-data:/data
    ports:
      - 9001:9001
      - 9000:9000
    command: ["server", "/data", "--console-address", ":9001"]
    networks:
      - trino-network

  
networks:
  trino-network:
    driver: bridge